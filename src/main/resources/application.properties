# 本地身份会话与访问控制演示配置（无外部身份服务依赖）
spring.application.name=identity-session-access-local
server.port=8080

# 短期凭证有效期（毫秒）：默认 15 分钟
identity.session.ttl-millis=900000
# 本地 HMAC 演示密钥（仅模拟，非真实凭据）
identity.token.secret=local-dev-secret-change-me

# 账号级活跃会话上限（超出时最久未活跃会话被自动结束）
identity.session.max-active-sessions-per-account=5
# 会话空闲超时（毫秒）：最近活跃时间超过该窗口即拒绝，默认 30 分钟
identity.session.idle-timeout-millis=1800000
